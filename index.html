<!DOCTYPE html>

<style>
:root{--bg:#FBF6EC;--card:#fff;--ink:#1E2833;--muted:#5B6672;--pri:#0F5E63;--pri-soft:#E1EFEE;--gold:#C9821F;--gold-soft:#FFF2DA;--ok:#2E7D4F;--ok-soft:#E4F3EA;--line:#E6DDCB;--lav:#EEF0FB;
 --s:#2456A6;--v:#B0132F;--o:#167257;--t:#7A4BB0;--fs:21px}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible","Noto Sans Bengali",system-ui,sans-serif;line-height:1.45;-webkit-text-size-adjust:100%}
.bn{font-family:"Noto Sans Bengali","Atkinson Hyperlegible",sans-serif}
.no-bn .bnh{display:none!important}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:16px 18px 22px;box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn{display:flex;align-items:center;justify-content:center;gap:.5em;width:100%;min-height:64px;border-radius:18px;border:2px solid transparent;font-size:1.08rem;font-weight:700;padding:.55em 1em;box-sizing:border-box;text-align:center}
.btn:active{transform:scale(.985)}
.btn-pri{background:var(--pri);color:#fff}
.btn-sec{background:#fff;border-color:var(--line)}
.btn-soft{background:var(--pri-soft);color:var(--pri)}
.btn small{display:block;font-weight:400;font-size:.8rem;opacity:.85}
.btn-col{flex-direction:column;gap:2px}
.row{display:flex;gap:12px}.row>*{flex:1}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid3 .btn{font-size:.92rem;min-height:84px;padding:.4em .3em}
.mt{margin-top:12px}.mt2{margin-top:20px}
.stack>*+*{margin-top:12px}
.card{background:var(--card);border-radius:22px;padding:18px;border:1px solid var(--line)}
h1{font-size:1.45rem;margin:.15em 0;line-height:1.25}
h2{font-size:1.12rem;margin:1.2em 0 .5em}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.big-en{font-size:1.5rem;font-weight:700;line-height:1.3;margin:.2em 0 .1em}
.huge-bn{font-size:1.4rem;font-weight:600;line-height:1.45;margin:.3em 0}
.meaning{font-size:1.05rem;color:var(--muted);margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:.35em;font-size:.82rem;font-weight:700;padding:.3em .8em;border-radius:99px;background:var(--pri-soft);color:var(--pri);margin-bottom:10px}
.chip.gold{background:var(--gold-soft);color:#8A5710}
.tip{background:var(--gold-soft);border-radius:16px;padding:12px 14px;margin-top:12px;font-size:.95rem}
.mn{background:var(--lav);border-radius:16px;padding:12px 14px;margin-top:10px;font-size:.98rem}
.mn b{display:block;font-size:.82rem;color:#4A4F86;margin-bottom:2px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.prog{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .4s}
.pill{border:2px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-size:.88rem;font-weight:700;min-height:44px}
.linkbtn{background:none;border:none;color:var(--muted);font-size:.92rem;padding:12px;text-decoration:underline;display:block;margin:4px auto 0}
.speak-row{display:flex;gap:10px;margin:12px 0 4px;flex-wrap:wrap}
.icon-btn{min-height:54px;padding:0 18px;border-radius:16px;border:2px solid var(--pri-soft);background:var(--pri-soft);color:var(--pri);font-size:1rem;font-weight:700;display:inline-flex;align-items:center;gap:.4em}
.icon-btn.light{background:#fff;border-color:var(--line);color:var(--ink)}
.icon-btn.sm{min-height:40px;padding:0 10px;font-size:.85rem;border-radius:12px}
.play-big{width:96px;height:96px;border-radius:50%;border:none;background:var(--pri);color:#fff;font-size:2.4rem;display:grid;place-items:center;margin:8px auto}
.bubble{background:var(--pri-soft);border-radius:20px 20px 20px 6px;padding:14px 16px;font-size:1.25rem;font-weight:700;line-height:1.35}
.bubble.me{background:var(--ok-soft);border-radius:20px 20px 6px 20px;margin-left:24px}
.bubble.sm{font-size:1rem;padding:10px 12px;font-weight:400}
.who{font-size:.85rem;color:var(--muted);margin:2px 0 6px;font-weight:700}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 16px;min-height:64px;font-size:1.08rem;font-weight:700;box-sizing:border-box}
.opt+.opt{margin-top:10px}

.calm{text-align:center;padding:24px 8px}

@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.r{font-weight:700;border-bottom:3px solid;padding:0 1px}
.r-s{color:var(--s);border-color:var(--s)}.r-v{color:var(--v);border-color:var(--v)}.r-o{color:var(--o);border-color:var(--o)}.r-t{color:var(--t);border-color:var(--t)}
.pattern{font-size:1.25rem;line-height:1.6;margin:12px 0;padding:12px 14px;background:#FAF8F3;border-radius:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.8rem;margin-bottom:8px}
.legend span{font-weight:700}
.ex{border-top:1px solid var(--line);padding:10px 0}
.ex-en{font-size:1.1rem;display:flex;justify-content:space-between;gap:8px;align-items:center}
.ex-bn{color:var(--muted);margin-top:2px}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--gold);text-align:center;color:var(--ok);font-weight:700}
.answer-line{min-height:62px;font-size:1.3rem;font-weight:700;padding:10px 12px;border:2px dashed var(--line);border-radius:16px;background:#FAF8F3;line-height:1.5}
.tiles{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.tile{min-height:56px;padding:0 18px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:1.15rem;font-weight:700;box-shadow:0 2px 0 var(--line)}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
label{display:block;font-weight:700;margin:16px 0 6px}
input,select,textarea{font:inherit;font-size:1rem;width:100%;box-sizing:border-box;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);min-height:54px}
textarea{min-height:90px;font-size:.8rem}
.stop{display:flex;gap:12px;align-items:center;padding:8px 0}
.dot{width:46px;height:46px;border-radius:50%;background:#fff;border:3px solid var(--line);display:grid;place-items:center;font-size:1.25rem;flex:none}
.stop.done .dot{border-color:var(--ok);background:var(--ok-soft)}
.stop.cur .dot{border-color:var(--pri);background:var(--pri-soft)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 2px}
.bar>i{display:block;height:100%;background:var(--ok)}
.stats{display:flex;gap:10px}
.stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;text-align:center;font-size:.9rem}
.stat b{display:block;font-size:1.5rem;color:var(--pri)}
.phr{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px}
.phr+.phr{margin-top:10px}
.phr .en{font-size:1.12rem;font-weight:700}
.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.acts button{min-height:46px;padding:0 14px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:700}
.overlay{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:28px;z-index:20;text-align:center;overflow:auto}
.overlay.left{justify-content:flex-start;text-align:left;align-items:stretch}
.overlay .huge{font-size:2.3rem;font-weight:700;line-height:1.3}
.warn{background:#FDECEC;border-radius:14px;padding:12px 14px;font-size:.9rem}
.center{text-align:center}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-top:8px;min-height:60px}
.lrow .ic{font-size:1.4rem;width:34px;text-align:center}
.lrow b{display:block}
.num{display:inline-block;font-size:.75rem;font-weight:700;color:var(--muted);background:#F1ECE1;border-radius:8px;padding:1px 7px;margin-right:6px}
.badge{font-size:.75rem;font-weight:700;color:var(--pri)}
.sum{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:10px;font-size:.95rem}
.sum .x{color:#9A6B2E;text-decoration:line-through}
.choicebar{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.choicebar button{min-height:48px;padding:0 14px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:1rem}
.choicebar button.on{border-color:currentColor;background:#F6F9FF}
.cb-s button.on{color:var(--s)}.cb-v button.on{color:var(--v)}.cb-o button.on{color:var(--o)}
.hl{background:var(--gold-soft);border-radius:6px;padding:0 3px}
.word-big{font-size:2rem;font-weight:700;color:var(--pri);line-height:1.2}
.timerbar{height:16px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px}.timerbar>i{display:block;height:100%;width:0;background:var(--ok);transition:width 1s linear}
.mistake{background:#FDE7C8;border-bottom:3px solid var(--gold);border-radius:4px;padding:0 2px}
.mistake.soft{background:#EEF0FB;border-color:#8B8FD0}
.heard{font-size:1.08rem;line-height:1.6;background:#FAF8F3;border-radius:12px;padding:10px 12px}
.fix{border-left:5px solid var(--gold);padding:10px 12px;margin-top:10px;background:#fff;border-radius:10px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.fix.soft{border-left-color:#8B8FD0}
.fx-wrong{text-decoration:line-through;color:#9A6B2E}
.fx-right{font-weight:700;color:var(--ok);font-size:1.12rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rep-head{font-size:1.2rem;font-weight:700}
.pw{display:inline-block;padding:3px 8px;border-radius:10px;margin:3px 2px;font-weight:700;border:none;font-size:1.05rem}
.pw.g{background:var(--ok-soft);color:var(--ok)}.pw.a{background:var(--gold-soft);color:#8A5710}.pw.r{background:#FDE4E1;color:#A3392B}.pw.m{background:#EEE;color:#888;text-decoration:line-through}
.stars{font-size:1.5rem;letter-spacing:2px}
.ai-wait{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--lav);font-weight:700}
.coach-badge{display:inline-block;font-size:.75rem;font-weight:700;color:#4A4F86;background:var(--lav);border-radius:99px;padding:2px 10px}
.plus-s{background:var(--gold-soft);color:#8A5710;border-radius:6px;padding:0 3px}
</style>
</head>

<script>
"use strict";
const WHO={son:{en:'my son',bn:'ছেলের',nom:'ছেলে'},daughter:{en:'my daughter',bn:'মেয়ের',nom:'মেয়ে'},family:{en:'my family',bn:'পরিবারের',nom:'পরিবার'}};
const STAY={'2w':{en:'two weeks',bn:'দুই সপ্তাহের'},'3w':{en:'three weeks',bn:'তিন সপ্তাহের'},'1m':{en:'one month',bn:'এক মাসের'},'2m':{en:'two months',bn:'দুই মাসের'},'3m':{en:'three months',bn:'তিন মাসের'},'6m':{en:'six months',bn:'ছয় মাসের'}};
const TIPS=[
 {en:"Forgetting is normal at any age. Every time you remember something again, it sticks a little better.",bn:"ভুলে যাওয়া স্বাভাবিক। প্রতিবার আবার মনে করলে আরও পাকা হয়।"},
 {en:"You read English well — that's a big strength. If you can't follow, ask: 'Could you write it down, please?'",bn:"আপনি ভালো ইংরেজি পড়তে পারেন — এটাই আপনার শক্তি!",say:"Could you write it down, please?"},
 {en:"British English often drops the 'r': car sounds like 'kaa', water like 'waw-tuh'.",bn:"ব্রিটিশরা শেষের 'r' প্রায় বলেই না: car = 'কা', water = 'ওয়াটা'।",say:"Car. Water. Better."},
 {en:"British people say 'sorry' a lot — even when you bump into them!",bn:"ব্রিটিশরা কথায় কথায় 'sorry' বলে!",say:"Oh, sorry!"},
 {en:"Always join the queue (the line). Everyone waits their turn.",bn:"Queue = 'কিউ' — Q অক্ষরের লেজের মতো লম্বা লাইন!",say:"Is this the queue?"},
 {en:"'Cheers' and 'Ta' both mean thank you.",bn:"'Cheers' আর 'Ta' — দুটোরই মানে ধন্যবাদ।",say:"Cheers! Ta!"},
 {en:"Say your phrases out loud while making tea. Speaking helps memory more than reading.",bn:"চা বানাতে বানাতে জোরে জোরে বলুন — পড়ার চেয়ে বলা বেশি মনে থাকে।"},
 {en:"Speaking slowly is not a weakness. Slow and clear is the best English.",bn:"আস্তে বলা দুর্বলতা নয় — আস্তে আর স্পষ্ট বলাই সেরা ইংরেজি।"},
 {en:"English order: Who → Action → What. 'I drink tea', not 'I tea drink'.",bn:"ইংরেজিতে কাজের শব্দ মাঝখানে: I drink tea।",say:"I drink tea."},
 {en:"Many words are the same in India and Britain: lift, flat, chemist, petrol. You already know lots!",bn:"লিফট, ফ্ল্যাট, পেট্রল — এসব শব্দ বিলেতেও একই!"},
 {en:"'Pardon?' is one little word that means 'Please say that again.'",bn:"'Pardon?' — এক শব্দেই 'আর একবার বলবেন?'",say:"Pardon?"},
 {en:"He for a man, she for a woman. Go slowly — it's the most common slip for Bengali speakers.",bn:"পুরুষ = he, মহিলা = she। ধীরে বলুন।",say:"He is my brother. She is my sister."},
 {en:"Five minutes of BBC radio or news each day trains your ears for the British accent.",bn:"রোজ পাঁচ মিনিট BBC শুনুন — কান ব্রিটিশ উচ্চারণে অভ্যস্ত হবে।"},
 {en:"Make your own sentences all day: 'I am cooking. I like this song.' Talking to yourself is great practice!",bn:"সারাদিন নিজে নিজে ছোট বাক্য বলুন — এটাই সেরা অনুশীলন!"},
 {en:"A small mistake? No problem. People care more about 'please' and 'thank you' than perfect grammar.",bn:"ভুল হলে চিন্তা নেই — 'please' আর 'thank you' বেশি জরুরি।"}
];
const OK_MSG=["🌟 Lovely!","👏 Well done!","✨ Brilliant!","🌼 শাবাশ!","👍 Spot on!","😊 Perfect!"];
const NO_MSG=["That's alright — this is the one.","Not yet — it will come!","Good try! Here's the right one.","No problem — now you know."];
const INTERVALS=[0,1,2,4,7,12,20,30,45,60];
const TYPE_LABEL={roleplay:'🎭 Role-play',word:'📝 New word',phrase:'🗣️ Say it',listen:'👂 Listen',reply:'💬 Reply',grammar:'✨ Better English',fill:'✏️ Fill the gap',build:'🧩 Build a sentence',concept:'📐 Grammar idea',speak:'🎤 Speak freely',dialog:'🎭 Conversation'};

/* ---------------- State ---------------- */
const KEY='cholo-v1';
const DEFAULTS={setupDone:false,name:'',who:'family',city:'Manchester',home:'Kolkata',stay:'3w',trip:'',minutes:12,newPerDay:3,size:'l',rate:0.85,bengali:true,mic:true,autoplay:true,voice:'',coachUrl:'',coachToken:''};
let storageOk=true;
function blank(){return {settings:{...DEFAULTS},cards:{},days:0,lastDay:null,lastDoneDay:null,newToday:{day:null,n:0},fixes:[],talk:{}};}
function merge(d){const b=blank(); if(!d||typeof d!=='object')return b; b.savedAt=d.savedAt||0; b.settings={...DEFAULTS,...(d.settings||{})}; if(b.settings.newPerDay==='auto')b.settings.newPerDay=3; if(d.cards&&typeof d.cards==='object')b.cards=d.cards; ['days','lastDay','lastDoneDay'].forEach(k=>{if(d[k]!==undefined)b[k]=d[k];}); if(d.newToday)b.newToday=d.newToday; if(Array.isArray(d.fixes))b.fixes=d.fixes; ['micOK','installed','hideInstall','hideVoiceTip','linkSetup'].forEach(k=>{if(d[k])b[k]=d[k];}); if(d.talk&&typeof d.talk==='object')b.talk=d.talk; return b;}
function load(){let d=null; try{d=JSON.parse(localStorage.getItem(KEY));}catch(e){storageOk=false;} return merge(d);}
/* Second copy in IndexedDB, so progress survives even if one store is cleared. */
let idb=null;
function idbOpen(){ return new Promise(res=>{ try{ const r=indexedDB.open('cholo',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>{idb=r.result;res(idb);}; r.onerror=()=>res(null);}catch(e){res(null);} }); }
function idbPut(v){ try{ if(!idb)return; idb.transaction('kv','readwrite').objectStore('kv').put(v,KEY);}catch(e){} }
function idbGet(){ return new Promise(res=>{ try{ if(!idb)return res(null); const r=idb.transaction('kv').objectStore('kv').get(KEY); r.onsuccess=()=>res(r.result||null); r.onerror=()=>res(null);}catch(e){res(null);} }); }
function save(){ S.savedAt=Date.now(); const j=JSON.stringify(S); try{localStorage.setItem(KEY,j);storageOk=true;}catch(e){storageOk=false;} idbPut(j); }
let persisted=false;
function askPersist(){ try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().then(v=>{persisted=v;}).catch(()=>{}); }catch(e){} }
let S=load();
(function applyLinkSetup(){ try{ const q=new URLSearchParams(location.search); const keys=['name','who','city','home','stay','trip','size']; let any=false;
 keys.forEach(k=>{ const v=q.get(k); if(v!=null&&v!==''){ if(k==='who'&&!['son','daughter','family'].includes(v))return; if(k==='stay'&&!['2w','3w','1m','2m','3m','6m'].includes(v))return; S.settings[k]=v.slice(0,60); any=true; } });
 if(any){ S.settings.setupDone=true; S.linkSetup=true; save(); history.replaceState(null,'',location.pathname+location.hash); } }catch(e){} })();
idbOpen().then(async()=>{ const j=await idbGet(); if(!j){ if(S.settings.setupDone)idbPut(JSON.stringify(S)); return; }
 try{ const d=JSON.parse(j); if((d.savedAt||0)>(S.savedAt||0)&&!SES){ S=merge(d); S.savedAt=d.savedAt; loadFixItems(); try{localStorage.setItem(KEY,j);}catch(e){} render(); } }catch(e){} });
askPersist();
function dayNum(d){d=d||new Date(); return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000);}
function daysLeft(){ const tr=S.settings.trip; if(!tr||!/^\d{4}-\d{2}-\d{2}$/.test(tr))return null; const [y,m,d]=tr.split('-').map(Number); return dayNum(new Date(y,m-1,d,12))-dayNum(); }
const isTravel=it=>TRAVEL_LESSONS.has(it.ln.id);

/* ---------------- Helpers ---------------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fill(s){ if(!s)return ''; const st=S.settings; const w=WHO[st.who]||WHO.family; const y=STAY[st.stay]||STAY['3w'];
 return String(s).replace(/\{name\}/g,(st.name||'').trim()||'(your name)').replace(/\{whoBn\}/g,w.bn).replace(/\{whoNom\}/g,w.nom).replace(/\{who\}/g,w.en)
  .replace(/\{city\}/g,(st.city||'').trim()||'London').replace(/\{home\}/g,(st.home||'').trim()||'Kolkata').replace(/\{stayBn\}/g,y.bn).replace(/\{stay\}/g,y.en);}
const F_=s=>esc(fill(s));
const strip=s=>fill(s).replace(/\{[svot]:([^}]*)\}/g,'$1');
const roles=s=>esc(fill(s)).replace(/\{([svot]):([^}]*)\}/g,'<span class="r r-$1">$2</span>');
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(n){const a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a;}
const fullFill=it=>it.text.replace('___',it.opts[it.a]);
function displayText(it){ switch(it.t){case 'roleplay':return it.title; case 'word':return it.w+' — '+it.en; case 'phrase':case 'listen':case 'build':return it.en; case 'reply':case 'grammar':return it.opts[it.a]; case 'fill':return fullFill(it); case 'concept':return it.title; case 'speak':return it.en; case 'dialog':return it.title;} return ''; }
function sayText(it){ switch(it.t){case 'roleplay':return (it.turns.find(t=>t.they)||it.turns[0]).ex; case 'word':return it.w+'. '+it.en; case 'phrase':case 'listen':return it.say||it.en; case 'build':return it.en; case 'reply':case 'grammar':return it.opts[it.a]; case 'fill':return fullFill(it); case 'concept':return strip(it.ex[0][0]); case 'speak':return it.ex;} return ''; }
const byId=Object.fromEntries(ITEMS.map(i=>[i.id,i]));
/* Her own corrections become revision cards ("Which is better English?") */
const FIX_LESSON={id:'myfixes',part:0,icon:'✏️',en:'My corrections',bn:'আমার শুধরে নেওয়া',items:[]};
function fixItem(f){ return {id:'fix:'+f.k,t:'grammar',u:'myfixes',opts:[f.r,f.w],a:0,bn:'',tip:f.why,mn:f.bn,ln:FIX_LESSON,num:'✏️'}; }
function loadFixItems(){ for(let i=ITEMS.length-1;i>=0;i--) if(ITEMS[i].u==='myfixes'){ delete byId[ITEMS[i].id]; ITEMS.splice(i,1); }
 (S.fixes||[]).forEach(f=>{ const it=fixItem(f); ITEMS.push(it); byId[it.id]=it; }); }
function addFixes(res){
 if(!SES||SES.mode==='preview') return 0; const t=dayNum(); let n=0;
 (res.cards||[]).filter(c=>c.w!==c.r).forEach(c=>{ const k=_h(c.r.toLowerCase()); if(S.fixes.some(x=>x.k===k))return;
   const rec={k,w:c.w,r:c.r,why:c.why,bn:c.bn,day:t}; S.fixes.push(rec); const it=fixItem(rec); ITEMS.push(it); byId[it.id]=it;
   S.cards[it.id]={box:1,due:t+1,seen:0,lapses:0,last:t}; n++; });
 if(S.fixes.length>120){ S.fixes=S.fixes.slice(-120); loadFixItems(); }
 if(n)save(); return n;

loadFixItems();

/* ---------------- Speech out ---------------- */
const synth=window.speechSynthesis||null; let voices=[];
function loadVoices(){ if(!synth)return; try{voices=synth.getVoices()||[];}catch(e){voices=[];} const sel=document.getElementById('voiceSel'); if(sel)fillVoiceSelect(sel); }
if(synth){ loadVoices(); try{synth.addEventListener('voiceschanged',loadVoices);}catch(e){synth.onvoiceschanged=loadVoices;} }
const gbVoices=()=>voices.filter(v=>/^en[-_]GB/i.test(v.lang));
function pickVoice(){ const gb=gbVoices(); if(S.settings.voice){const v=gb.find(v=>v.name===S.settings.voice); if(v)return v;} return gb.find(v=>/google/i.test(v.name))||gb[0]||null; }
let speakToken=0;
function speak(text,opt){ opt=opt||{}; if(!synth||!text){opt.onend&&opt.onend();return;}
 const tok=++speakToken; try{ synth.cancel(); }catch(e){}
 setTimeout(()=>{ if(tok!==speakToken)return; try{ const u=new SpeechSynthesisUtterance(strip(text).replace(/\s*\(your name\)/g,'')); const v=pickVoice(); if(v)u.voice=v; u.lang=v?v.lang:'en-GB';
   u.rate=(+S.settings.rate||0.85)*(opt.slow?0.7:1); u.pitch=opt.pitch||1; if(opt.onend){u.onend=()=>{if(tok===speakToken)opt.onend();};u.onerror=u.onend;} synth.speak(u);}catch(e){opt.onend&&opt.onend();} },60);
}
let seqId=0;
function speakSeq(lines){ const my=++seqId; const step=i=>{ if(i>=lines.length||my!==seqId)return; speak(lines[i].text,{pitch:lines[i].pitch,onend:()=>setTimeout(()=>step(i+1),300)}); }; step(0); }
function speakRow(text){ return `<div class="speak-row"><button class="icon-btn" data-act="say" data-text="${esc(text)}">🔊 Listen</button><button class="icon-btn light" data-act="say" data-arg="slow" data-text="${esc(text)}">🐢 Slowly</button></div>`; }

/* ---------------- Speech in (optional, gentle) ---------------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null; let micBroken=false; let recog=null;
const CONTR={"i'm":"i am","it's":"it is","that's":"that is","i've":"i have","isn't":"is not","don't":"do not","can't":"can not","cannot":"can not","where's":"where is","what's":"what is","you're":"you are","i'd":"i would","let's":"let us","didn't":"did not","i'll":"i will","we're":"we are","there's":"there is"};
function words(s){ return strip(s).toLowerCase().replace(/[’]/g,"'").split(/\s+/).map(w=>w.replace(/[^a-z0-9'£]/g,'')).filter(Boolean).flatMap(w=>(CONTR[w]||w).split(' ')).map(w=>w.replace(/'/g,'')); }
function overlap(target,heard){ const t=words(target), h=words(heard); if(!t.length)return 0; const pool={}; h.forEach(w=>pool[w]=(pool[w]||0)+1); let hit=0; t.forEach(w=>{if(pool[w]){hit++;pool[w]--;}}); return hit/t.length; }
function micHelp(){ return S.micOK?'':`<div class="small bn muted mt">🎤 প্রথমবার ফোন জিজ্ঞেস করবে মাইক্রোফোন ব্যবহার করবে কি না — <b>Allow</b> (অনুমতি দিন) টিপুন।</div>`; }

 return `<div class="say-box"><div class="say-title">${title||'🗣️ Now you say it — out loud'}</div><div class="bn bnh muted small">এবার জোরে জোরে বলুন</div>
 ${!free&&pronAvailable()?`<button class="btn btn-soft mt" data-act="pronrec" data-text="${esc(text)}">🎤 Say it — your coach will listen</button><div id="micfb" class="micfb" aria-live="polite"></div>${micHelp()}`
   :can?`<button class="btn btn-soft mt" data-act="mic" data-text="${esc(text)}" ${free?'data-free="1"':''}>🎤 Let the phone listen</button><div id="micfb" class="micfb" aria-live="polite"></div>${micHelp()}`:''}</div>`;
}
/* ---------- Longer listening (talk) + speaking report ---------- */
let talk=null;
function talkAvailable(){ return !!(S.settings.mic&&SR&&!micBroken); }
function startTalk(){
 if(!talkAvailable()) return false; try{synth&&synth.cancel();}catch(e){}
 talk={finals:[],interim:'',active:true,errored:false};
 const go=()=>{ let r; try{r=new SR();}catch(e){micBroken=true;talk.active=false;return;} talk.r=r;
  r.lang='en-GB'; r.continuous=true; r.interimResults=true; r.maxAlternatives=1;
  r.onresult=e=>{ if(!talk)return; if(!S.micOK){S.micOK=true;save();} let interim=''; for(let i=e.resultIndex;i<e.results.length;i++){ const x=e.results[i]; if(x.isFinal) talk.finals.push(x[0].transcript); else interim+=x[0].transcript; } talk.interim=interim; };
  r.onerror=e=>{ if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){ micBroken=true; if(talk){talk.active=false;talk.errored=true;} } };
  r.onend=()=>{ if(!talk)return; if(talk.active){ setTimeout(()=>{ if(talk&&talk.active) go(); },150); } else if(talk.onDone){ const f=talk.onDone; talk.onDone=null; f(); } };
  try{r.start();}catch(e){} };
 go(); return true;
}
function stopTalk(cb){
 if(!talk){cb('',false);return;} const tk=talk; tk.active=false;
 const done=()=>{ const t=(tk.finals.join(' ')+' '+(tk.interim||'')).replace(/\s+/g,' ').trim(); if(talk===tk)talk=null; cb(t,tk.errored); };
 tk.onDone=done; try{tk.r&&tk.r.stop();}catch(e){} setTimeout(()=>{ if(tk.onDone){ tk.onDone=null; done(); } },1800);
}
function abortTalk(){ if(talk){ talk.active=false; talk.onDone=null; try{talk.r&&talk.r.abort();}catch(e){} talk=null; } }
function fullCorrected(res){ let out='',k=0; res.fixes.filter(f=>!f.soft).forEach(f=>{out+=res.text.slice(k,f.start)+f.better;k=f.end;}); return out+res.text.slice(k); }
function coachContext(){
 const e=SES&&SES.q[SES.i]; if(!e||!e.it) return {};
 const it=e.it, lvl=['','easy','medium','hard'];
 if(it.t==='roleplay'){ const t=it.turns[Math.min(CS.turn,it.turns.length-1)]; return {task:fill(t.task)+' (role-play: '+fill(it.title)+')',they:fill(t.they),example:fill(t.ex),level:lvl[it.level]}; }
 if(it.t==='speak') return {task:fill(it.en),example:fill(it.ex)};
 return {task:'Say: '+fill(sayText(it))};
}
function reportHead(res,itId){
 const prev=(S.talk&&itId)?S.talk[itId]:null; const isPrev=SES&&SES.mode==='preview'; let best='';
 if(itId&&!isPrev){ if(prev&&res.words>prev.best) best=` 🏅 New best! (before: ${prev.best})`; else if(prev) best=` · Your best: ${prev.best}`;
   S.talk[itId]={best:Math.max(res.words,prev?prev.best:0),last:res.words}; save(); }
 return `<div class="rep-head">🌟 You said ${res.words} words!<span class="small" style="font-weight:400">${best}</span></div>`;
}
function addFixCards(cards){
 if(!SES||SES.mode==='preview') return 0; const t=dayNum(); let n=0;
 cards.filter(c=>c&&c.w&&c.r&&c.w!==c.r).forEach(c=>{ const k=_h(c.r.toLowerCase()); if(S.fixes.some(x=>x.k===k))return;
   const rec={k,w:c.w,r:c.r,why:c.why||'',bn:c.bn||'',day:t}; S.fixes.push(rec); const it=fixItem(rec); ITEMS.push(it); byId[it.id]=it;
   S.cards[it.id]={box:1,due:t+1,seen:0,lapses:0,last:t}; n++; });
 if(S.fixes.length>120){ S.fixes=S.fixes.slice(-120); loadFixItems(); }
 if(n)save(); return n;
}
function localReportBody(res,added){
 const hard=res.fixes.filter(f=>!f.soft), soft=res.fixes.filter(f=>f.soft);
 let h=`<div class="who mt">What I heard:</div><div class="heard">${CK.markText(res)}</div>`;
 if(hard.length){
  h+=`<div class="who mt">✏️ Let's correct ${hard.length===1?'this':'these '+hard.length}:</div>`+hard.map(f=>`<div class="fix">
    <div class="small muted">You said:</div><div class="fx-wrong">${esc(f.said)}</div>
    <div class="small muted" style="margin-top:4px">Better:</div><div class="fx-right">${esc(f.better)} <button class="icon-btn sm" data-act="say" data-text="${esc(f.rightLine.replace(/…/g,''))}">🔊</button></div>
    <div class="small" style="margin-top:6px">💡 ${esc(f.why)}</div><div class="small bn bnh muted">${esc(f.bn)}</div></div>`).join('');
  h+=`<button class="btn btn-soft mt" data-act="say" data-text="${esc(fullCorrected(res))}">🔊 Hear it all said correctly</button>`;
  if(added) h+=`<div class="small muted mt">✏️ ${added===1?'This correction':'These corrections'} will come back in your revision, so you practise the right way.</div>`;
 }
 if(soft.length){ h+=`<div class="who mt">🔎 Please check:</div>`+soft.map(f=>`<div class="fix soft"><div><b>${esc(f.said)}</b></div><div class="small" style="margin-top:4px">💡 ${esc(f.why)}</div><div class="small bn bnh muted">${esc(f.bn)}</div></div>`).join(''); }
 if(!hard.length&&!soft.length) h+=`<div class="tip">✅ I didn't find any of the common mistakes I check for. Lovely!</div>`;
 if(res.good.length) h+=`<div class="small mt">👍 Good: you ${res.good.join(', ')}.</div>`;
 h+=`<div class="small muted mt">The phone checks for common mistakes only. It can miss some, and sometimes it mishears — if a word looks wrong, it may be the phone, not you!</div>`;
 return h;
}
function aiReportBody(ai,res,added){
 const corr=Array.isArray(ai.corrections)?ai.corrections.filter(c=>c&&c.better):[]; const pr=Array.isArray(ai.pronunciation)?ai.pronunciation.filter(p=>p&&(p.maybe||p.tip)):[];
 let marked=esc(res.text); corr.forEach(c=>{ if(c.said){ const e=esc(c.said); const i=marked.toLowerCase().indexOf(e.toLowerCase()); if(i>=0) marked=marked.slice(0,i)+'<span class="mistake">'+marked.slice(i,i+e.length)+'</span>'+marked.slice(i+e.length); } });
 let h=`<div class="tip" style="background:var(--ok-soft)">🌟 ${esc(ai.praise||'Well done for speaking!')}<div class="bn bnh small">${esc(ai.praise_bn||'')}</div></div>
  <div class="who mt">What I heard:</div><div class="heard">${marked}</div>`;
 if(corr.length){
  h+=`<div class="who mt">✏️ Your coach suggests:</div>`+corr.map(c=>`<div class="fix">
    ${c.said?`<div class="small muted">You said:</div><div class="fx-wrong">${esc(c.said)}</div>`:''}
    <div class="small muted" style="margin-top:4px">Better:</div><div class="fx-right">${esc(c.better)} <button class="icon-btn sm" data-act="say" data-text="${esc(c.sentence_better||c.better)}">🔊</button></div>
    ${c.why?`<div class="small" style="margin-top:6px">💡 ${esc(c.why)}</div>`:''}${c.why_bn?`<div class="small bn bnh muted">${esc(c.why_bn)}</div>`:''}</div>`).join('');
 } else if(ai.all_good!==false){ h+=`<div class="tip">✅ No mistakes — lovely, natural English!</div>`; }
 if(pr.length){ h+=`<div class="who mt">🗣️ Sounds to practise:</div>`+pr.map(p=>`<div class="fix soft">${p.heard&&p.maybe?`<div class="small">The phone heard “${esc(p.heard)}” — you probably said <b>${esc(p.maybe)}</b>.</div>`:''}
    ${p.maybe?`<button class="icon-btn sm mt" data-act="say" data-arg="slow" data-text="${esc(p.maybe)}">🔊 ${esc(p.maybe)}</button>`:''}
    ${p.tip?`<div class="small" style="margin-top:6px">💡 ${esc(p.tip)}</div>`:''}${p.tip_bn?`<div class="small bn bnh muted">${esc(p.tip_bn)}</div>`:''}</div>`).join(''); }
 if(ai.corrected&&corr.length) h+=`<button class="btn btn-soft mt" data-act="say" data-text="${esc(ai.corrected)}">🔊 Hear it all said correctly</button>`;
 if(ai.better_way) h+=`<div class="who mt">✨ A natural British way to say it:</div><div class="bubble me" style="margin-left:0">${esc(ai.better_way)}</div><button class="icon-btn sm mt" data-act="say" data-text="${esc(ai.better_way)}">🔊 Listen</button>`;
 if(ai.encourage) h+=`<div class="tip mt">💛 ${esc(ai.encourage)}<div class="bn bnh small">${esc(ai.encourage_bn||'')}</div></div>`;
 if(added) h+=`<div class="small muted mt">✏️ ${added===1?'This correction':'These corrections'} will come back in your revision.</div>`;
 return h+`<div class="mt"><span class="coach-badge">🤖 Checked by your AI coach</span></div>`;
}
function showReport(text,target,itId){
 if(!target)return; const res=CK.check(text);
 if(!res.words){ target.innerHTML=`<div class="tip">I couldn't hear any words. That's alright — try again a little louder, or type what you said below.</div>`; return; }
 const head=reportHead(res,itId);

 if(!useAI){ const added=addFixCards(res.cards||[]); target.innerHTML=head+localReportBody(res,added); return; }
 const token=Math.random(); target.dataset.tok=token;
 target.innerHTML=head+`<div class="ai-wait">🤖 Your coach is checking what you said…</div>`+`<div class="small muted mt">Quick check while you wait:</div>`+localReportBody(res,0);
 COACH.check(res.text,coachContext()).then(ai=>{
  if(target.dataset.tok!=String(token)||!document.body.contains(target))return;
  const cards=(Array.isArray(ai.corrections)?ai.corrections:[]).filter(c=>c&&c.said&&c.better).map(c=>{ const r=String(c.sentence_better||c.better); const i=r.toLowerCase().indexOf(String(c.better).toLowerCase());
    const w=i>=0?r.slice(0,i)+c.said+r.slice(i+String(c.better).length):c.said; return {w,r,why:c.why,bn:c.why_bn}; });
  const added=addFixCards(cards); target.innerHTML=head+aiReportBody(ai,res,added);
 }).catch(()=>{

  const added=addFixCards(res.cards||[]); target.innerHTML=head+`<div class="small muted mt">🤖 The coach couldn't be reached just now, so the phone checked it instead.</div>`+localReportBody(res,added);
 });

/* ---------- Pronunciation (say-it cards) ---------- */
let lastRecUrl=null;
function pronAvailable(){ return !!(COACH.info.pron&&S.settings.mic&&REC.supported()&&navigator.onLine!==false); }
function soundTip(w){ w=String(w).toLowerCase();
 if(/th/.test(w))return ["'th': put the tip of your tongue lightly between your teeth.","th: জিভের ডগা আলতো করে দাঁতের ফাঁকে।"];
 if(/v/.test(w))return ["'v': rest your top teeth gently on your bottom lip.","v: উপরের দাঁত নিচের ঠোঁটে আলতো করে।"];
 if(/w/.test(w))return ["'w': round your lips like a small 'o' — no teeth.","w: ঠোঁট গোল করুন — দাঁত লাগবে না।"];
 if(/z/.test(w))return ["'z': buzz like a bee — not 'j'.","z: মৌমাছির গুঞ্জন — 'জ' নয়।"];
 if(/^s[ptkcmnlw]/.test(w))return ["Start straight with 'sss' — no little 'i' before it.","শুরুতে 'ই' নয় — সরাসরি 'স্‌স্‌'।"];
 if(/r/.test(w))return ["British English often drops the 'r' at the end of a word or before a consonant.","শেষের 'r' ব্রিটিশরা প্রায় বলে না।"];
 return ["Listen to the voice slowly, copy it, then try again.","আস্তে শুনে হুবহু নকল করুন, তারপর আবার।"]; }
function pronResultHTML(r,text){
 if(!r||!r.words||!r.words.length) return `<div class="tip">I couldn't hear you clearly. Try again, holding the phone a little closer. 😊</div>`;
 const sc=r.score||0; const stars=sc>=85?5:sc>=70?4:sc>=55?3:2;
 const msg=sc>=85?["🌟 Excellent — very clear British English!","দারুণ! খুব স্পষ্ট!"]:sc>=70?["👏 Very good! Just polish the coloured words.","খুব ভালো! রঙিন শব্দগুলো একটু ঝালিয়ে নিন।"]:sc>=55?["👍 Good! Let's practise a couple of sounds.","ভালো! কয়েকটা আওয়াজ অনুশীলন করি।"]:["😊 Good try! Listen once more and copy the voice — you'll get there.","ভালো চেষ্টা! আর একবার শুনে নকল করুন — হয়ে যাবে।"];
 const weak=r.words.filter(w=>w.error==='Omission'||w.score<70);
 const chips=r.words.map(w=>{ const cls=w.error==='Omission'?'m':w.score>=80?'g':w.score>=60?'a':'r'; return `<button class="pw ${cls}" data-act="say" data-arg="slow" data-text="${esc(w.w)}">${esc(w.w)}</button>`; }).join(' ');
 const tips=weak.slice(0,2).map(w=>{ const [en,bn]=soundTip(w.w); return `<div class="fix soft"><b>${esc(w.w)}</b>${w.error==='Omission'?' <span class="small muted">(missed)</span>':''} <button class="icon-btn sm" data-act="say" data-arg="slow" data-text="${esc(w.w)}">🔊</button><div class="small" style="margin-top:4px">💡 ${esc(en)}</div><div class="small bn bnh muted">${esc(bn)}</div></div>`; }).join('');
 return `<div class="stars">${'⭐'.repeat(stars)}<span style="opacity:.25">${'⭐'.repeat(5-stars)}</span></div>
  <div class="rep-head" style="font-size:1.05rem">${msg[0]}</div><div class="bn bnh small muted">${msg[1]}</div>
  <div class="who mt">Each word (tap one to hear it):</div><div>${chips}</div>
  <div class="small muted">🟢 clear · 🟡 nearly · 🔴 practise this one${r.words.some(w=>w.error==='Omission')?' · grey = missed':''}</div>
  ${tips}
  <div class="row mt"><button class="btn btn-sec" data-act="playme">▶ Hear yourself</button><button class="btn btn-soft" data-act="say" data-text="${esc(text)}">🔊 Hear the voice</button></div>
  <div class="mt"><span class="coach-badge">🤖 Pronunciation checked by your AI coach</span></div>`;
}
function typedBox(itId){ return `<button class="linkbtn" data-act="typeopen">✍️ Or type what you said, and I'll check it</button>

function startMic(text,btn){
 const fb=document.getElementById('micfb'); if(!SR||!fb)return; const free=!!btn.dataset.free;
 if(free){
  if(talk){ btn.disabled=true; btn.textContent='⏳ Checking…'; stopTalk((t,err)=>{ btn.disabled=false; btn.textContent='🎤 Speak again';
     if(err&&!t){ fb.textContent="That's fine — the phone can't listen here. Type what you said below instead."; btn.remove(); return; }
     showReport(t,fb,SES&&SES.q[SES.i]&&SES.q[SES.i].it.id); }); return; }
  if(!startTalk()){ fb.textContent="The phone can't listen here — type what you said below instead."; btn.remove(); return; }
  btn.textContent="✋ I've finished — check it"; fb.innerHTML='<span class="muted">🎙️ Listening — take your time…</span>'; return;
 }
 try{synth&&synth.cancel();}catch(e){} try{ if(recog)recog.abort(); }catch(e){}
 try{ recog=new SR(); }catch(e){ micBroken=true; fb.textContent="That's fine — just say it out loud. 😊"; btn.remove(); return; }
 recog.lang='en-GB'; recog.interimResults=false; recog.maxAlternatives=3; if(free)recog.continuous=false;
 btn.disabled=true; btn.textContent='🎙️ Listening… speak now'; fb.textContent='';
 let got=false;
 recog.onresult=e=>{ got=true; if(!S.micOK){S.micOK=true;save();} const alts=[]; for(let i=0;i<e.results[0].length;i++)alts.push(e.results[0][i].transcript);
   if(free){ fb.innerHTML=`🌟 Lovely — you made your own sentence!<div class="small muted" style="font-weight:400">I heard: “${esc(alts[0])}”</div>`; return; }
   let best=0,bestT=''; alts.forEach(a=>{const sc=overlap(text,a); if(sc>best){best=sc;bestT=a;}});
   if(best>=0.75) fb.innerHTML='🌟 Lovely! Very clear.<div class="bn bnh small muted">খুব সুন্দর বলেছেন!</div>';
   else if(best>=0.45) fb.innerHTML=`👍 Good — nearly all there!<div class="small muted" style="font-weight:400">I heard: “${esc(bestT)}”</div><div class="small muted" style="font-weight:400">Listen once more and try again, if you like.</div>`;
   else fb.innerHTML="😊 Good try! The phone didn't catch all of it — that's normal, phones are fussy. Listen once more, or just carry on.";
 };
 recog.onerror=e=>{ if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){ micBroken=true; fb.textContent="That's fine — just say it out loud. Speaking is what matters. 😊"; btn.remove(); return; }
   fb.textContent="I couldn't hear clearly. That's alright — try once more, or carry on."; };
 recog.onend=()=>{ if(document.body.contains(btn)){btn.disabled=false;btn.textContent='🎤 Try again';} if(!got&&!fb.textContent)fb.textContent="I didn't hear anything. Tap and speak a little louder — or just carry on."; };
 try{recog.start();}catch(e){ micBroken=true; fb.textContent="That's fine — just say it out loud. 😊"; btn.remove(); }
}

/* ---------------- Scheduling ---------------- */
let SES=null; let CS={};
function newCS(){ CS={hintShown:false,revealed:false,hint:false,chosen:null,order:null,auto:false,showWords:false,placed:null,wrong:0,shake:-1,turn:0,misses:0,dlgDone:false,showEx:false}; }
const gapDays=()=>S.lastDay==null?0:dayNum()-S.lastDay;
const learnedCount=()=>Object.keys(S.cards).length;
const allLearned=()=>!ITEMS.some(i=>!S.cards[i.id]);
function isRevisionDay(){ const n=S.lastDay===dayNum()?S.days:(S.days||0)+1; return n>=7&&n%7===0; }
function finalWeeks(){ const l=daysLeft(); return l!=null&&l>0&&l<=35; }
function newQuota(){ const t=dayNum(); let q=+S.settings.newPerDay||3; const l=daysLeft(); if(l!=null&&l>0&&l<=7)q=Math.min(q,1);
 const done=S.newToday&&S.newToday.day===t?S.newToday.n:0; return Math.max(0,q-done); }
function nextNew(n){ let pool=ITEMS.filter(i=>!S.cards[i.id]); if(finalWeeks()){ const pri=i=>isTravel(i)||i.ln.part===5; pool=pool.filter(pri).concat(pool.filter(i=>!pri(i))); } const out=[]; for(const it of pool){ if(out.length>=n)break; out.push(it); if(it.t==='roleplay'||it.t==='dialog')break; } return out; }
function dueItems(){ const t=dayNum(); return ITEMS.filter(it=>S.cards[it.id]&&S.cards[it.id].due<=t).sort((a,b)=>S.cards[a.id].due-S.cards[b.id].due||S.cards[a.id].box-S.cards[b.id].box); }
function refreshPicks(n,exclude){ if(n<=0)return []; const t=dayNum(); const fin=finalWeeks();
 const pool=ITEMS.filter(i=>{const c=S.cards[i.id]; return c&&i.t!=='roleplay'&&!exclude.has(i.id)&&c.due>t&&(t-(c.last||0))>=2;});
 const sc=i=>{const c=S.cards[i.id]; return (c.last||0)+c.box*4-(fin&&isTravel(i)?40:0)+Math.random()*3;};
 return pool.sort((a,b)=>sc(a)-sc(b)).slice(0,n); }
const REV_TARGET={normal:12,rev:18,tired:6};
function planToday(mode){
 const rev=mode==='normal'&&isRevisionDay(); const gap=gapDays();
 let revCap=mode==='tired'?6:rev?22:18; let newN=(mode==='tired'||rev)?0:newQuota();
 if(gap>=3){revCap=Math.min(revCap,10);newN=Math.min(newN,1);}
 let due=dueItems(); if(due.length>40)newN=Math.min(newN,1); else if(due.length>25)newN=Math.min(newN,2);
 { const big={}; due=due.filter(i=>{ if(i.t==='roleplay'||i.t==='dialog'){ if(big[i.t])return false; big[i.t]=1; } return true; }); }
 due=due.slice(0,revCap);
 const target=mode==='tired'?REV_TARGET.tired:rev?REV_TARGET.rev:REV_TARGET.normal;
 const refresh=refreshPicks(Math.max(0,target-due.length),new Set(due.map(i=>i.id)));
 return {rev,due,refresh,fresh:nextNew(newN)};
}
function buildSession(mode){
 const {rev,due,refresh,fresh}=planToday(mode);
 const reviews=due.concat(refresh);
 const warm=reviews.filter(i=>i.t!=='dialog'&&i.t!=='roleplay').sort((a,b)=>S.cards[b.id].box-S.cards[a.id].box).slice(0,3);
 const rest=reviews.filter(x=>!warm.includes(x));
 const q=warm.map(it=>({it,kind:'review'})); let ri=0;
 fresh.forEach(it=>{ q.push({it,kind:'learn'}); for(let k=0;k<2&&ri<rest.length;k++)q.push({it:rest[ri++],kind:'review'}); });
 fresh.filter(it=>!['dialog','speak','roleplay'].includes(it.t)).forEach(it=>q.push({it,kind:'check'}));
 while(ri<rest.length)q.push({it:rest[ri++],kind:'review'});
 return {q,rev};
}
function buildExtra(){ const t=dayNum(); const seen=ITEMS.filter(it=>S.cards[it.id]&&S.cards[it.id].last!==t); seen.sort((a,b)=>(S.cards[a.id].box*3+(S.cards[a.id].last||0)/30)-(S.cards[b.id].box*3+(S.cards[b.id].last||0)/30)||(Math.random()-.5)); return seen.slice(0,8).map(it=>({it,kind:'extra'})); }
function startSession(mode,lessonNum){
 let q=[],rev=false;
 if(mode==='preview'){ const l=LESSONS[lessonNum-1]; q=l.items.map(it=>({it,kind:'preview'})); }
 else if(mode==='extra') q=buildExtra();
 else ({q,rev}=buildSession(mode));
 SES={q,i:0,mode,rev,lessonNum,start:Date.now(),hidden:0,hiddenAt:null,misses:0,streak:0,calms:0,done:0,newIds:[],ended:false,reason:'',
      cap:(mode==='tired'?5:mode==='extra'?7:mode==='preview'?999:+S.settings.minutes)*60000};
 newCS();
}
document.addEventListener('visibilitychange',()=>{ if(!SES)return; if(document.hidden)SES.hiddenAt=Date.now(); else if(SES.hiddenAt){SES.hidden+=Date.now()-SES.hiddenAt;SES.hiddenAt=null;} });
const elapsed=()=>Date.now()-SES.start-SES.hidden;
function markPractised(){ const t=dayNum(); if(S.lastDay!==t){S.days=(S.days||0)+1;S.lastDay=t;} }
function interval(box){ let iv=INTERVALS[box]; const l=daysLeft(); if(l!=null&&l>0&&l<=120) iv=Math.min(iv,Math.max(2,Math.floor(l/3))); return iv; }
function grade(e,ok){
 const t=dayNum(); const id=e.it.id; let c=S.cards[id];
 if(e.kind==='learn'){ S.cards[id]={box:1,due:t+1,seen:1,lapses:0,last:t}; if(!S.newToday||S.newToday.day!==t)S.newToday={day:t,n:0}; S.newToday.n++; SES.newIds.push(id); return; }
 if(!c)return; c.last=t;
 if(e.kind==='check'||e.kind==='retry'){ if(!ok)c.due=t+1; return; }
 if(e.kind==='extra'){ if(!ok){c.box=Math.max(1,c.box-1);c.due=Math.min(c.due,t+1);} else if(c.due<=t+1){c.due=t+interval(c.box);} return; }
 c.seen=(c.seen||0)+1;
 if(ok){ c.box=Math.min(INTERVALS.length-1,c.box+1); c.due=t+interval(c.box); }
 else { c.box=Math.max(1,Math.floor(c.box/2)); c.due=t+1; c.lapses=(c.lapses||0)+1; }
}
function afterAnswer(ok){
 const e=SES.q[SES.i];
 if(SES.mode==='preview'){ SES.done++; advance(); return; }
 grade(e,ok); markPractised(); SES.done++; save();
 if(!ok&&(e.kind==='review'||e.kind==='extra')&&e.it.t!=='dialog') SES.q.splice(Math.min(SES.i+3,SES.q.length),0,{it:e.it,kind:'retry'});
 if(ok)SES.streak=0; else{SES.streak++;SES.misses++;}
 if(SES.streak>=2){
  SES.streak=0; SES.calms++;
  if(SES.calms>=2||SES.misses>=6){ endSession('tired'); return; }
  const fut=SES.q.slice(SES.i+1); const learnIds=new Set(fut.filter(x=>x.kind==='learn').map(x=>x.it.id));
  let keep=fut.filter(x=>!(x.it&&learnIds.has(x.it.id)&&(x.kind==='learn'||x.kind==='check')));
  let bi=-1,bb=-1; keep.forEach((x,k)=>{ if(x.kind==='review'&&x.it.t!=='dialog'){const b=S.cards[x.it.id].box; if(b>bb){bb=b;bi=k;}} });
  if(bi>0){const [easy]=keep.splice(bi,1); keep.unshift(easy);}
  SES.q=SES.q.slice(0,SES.i+1).concat([{kind:'calm'}],keep);
 }
 advance();
}
function advance(){
 clearInterval(timerInt); timerRunning=false; abortTalk(); if(REC.active)REC.cancel(); SES.i++; newCS();
 if(SES.i>=SES.q.length){ endSession('complete'); return; }
 if(elapsed()>=SES.cap&&SES.q[SES.i].kind!=='calm'){ endSession('time'); return; }
 render(); window.scrollTo(0,0);
}
function endSession(reason){
 if(!SES)return; SES.ended=true; SES.reason=reason; try{synth&&synth.cancel();}catch(e){}
 if(SES.mode==='preview'){ const n=SES.lessonNum; SES=null; go('lesson-'+n); return; }
 if(reason!=='rest'&&SES.done>0&&SES.mode!=='extra') S.lastDoneDay=dayNum();
 save(); go('well-done');
}

function chipFor(e){

  case 'grammar': b=`✓ <b>${F_(it.opts[0])}</b> ${say(it.opts[0])}<div class="x">${F_(it.opts[1])}</div><div class="bn muted">${F_(it.bn)}</div>`; break;

const B_WHO=[{en:'I',bn:'আমি',p:0},{en:'You',bn:'আপনি',p:1},{en:'He',bn:'ও (পুরুষ)',p:2},{en:'She',bn:'ও (মহিলা)',p:2},{en:'We',bn:'আমরা',p:3},{en:'They',bn:'ওরা',p:4},{en:'My son',bn:'আমার ছেলে',p:2},{en:'My friend',bn:'আমার বন্ধু',p:2}];
const B_VERB=[
 {en:'drink',s:'drinks',bn:['খাই','খান','খায়','খাই','খায়'],o:[['tea','চা'],['coffee','কফি'],['water','জল']],mn:'বাংলায় চা "খাই", ইংরেজিতে "drink"!'},
 {en:'eat',s:'eats',bn:['খাই','খান','খায়','খাই','খায়'],o:[['rice','ভাত'],['fish','মাছ'],['sweets','মিষ্টি']]},
 {en:'like',s:'likes',bn:['পছন্দ করি','পছন্দ করেন','পছন্দ করে','পছন্দ করি','পছন্দ করে'],o:[['music','গান'],['London','লন্ডন'],['cooking','রান্না']]},
 {en:'live',s:'lives',bn:['থাকি','থাকেন','থাকে','থাকি','থাকে'],o:[['in India','ভারতে'],['in London','লন্ডনে'],['near the park','পার্কের কাছে']]},
 {en:'speak',s:'speaks',bn:['বলি','বলেন','বলে','বলি','বলে'],o:[['Bengali','বাংলা'],['English','ইংরেজি'],['Hindi','হিন্দি']]},
 {en:'go',s:'goes',bn:['যাই','যান','যায়','যাই','যায়'],o:[['to the park','পার্কে'],['to the shops','দোকানে'],['to work','কাজে']]},
 {en:'read',s:'reads',bn:['পড়ি','পড়েন','পড়ে','পড়ি','পড়ে'],o:[['the newspaper','খবরের কাগজ'],['books','বই']]},
 {en:'watch',s:'watches',bn:['দেখি','দেখেন','দেখে','দেখি','দেখে'],o:[['TV','টিভি'],['the news','খবর']]},
 {en:'want',s:'wants',bn:['চাই','চান','চায়','চাই','চায়'],o:[['a cup of tea','এক কাপ চা'],['a taxi','একটা ট্যাক্সি']]}
];
let BS={w:0,v:0,o:0,m:'say'};
function builderSentence(){
 const w=B_WHO[BS.w], v=B_VERB[BS.v], o=v.o[Math.min(BS.o,v.o.length-1)]; const third=w.p===2;
 let en,html,bn,note='';
 const S_=`<span class="r r-s">${esc(w.en)}</span>`, O_=`<span class="r r-o">${esc(o[0])}</span>`;
 if(BS.m==='say'){ const vv=third?v.s:v.en; en=`${w.en} ${vv} ${o[0]}.`;
   html=`${S_} <span class="r r-v">${third?esc(v.en)+'<span class="plus-s">'+esc(v.s.slice(v.en.length))+'</span>':esc(vv)}</span> ${O_}.`;
   bn=`<span class="r r-s">${w.bn.split(' (')[0]}</span> <span class="r r-o">${o[1]}</span> <span class="r r-v">${v.bn[w.p]}</span>।`;
   if(third)note=`${w.en} = one other person → add <b>${esc(v.s.slice(v.en.length))}</b>: ${esc(v.s)}.`; }
 else if(BS.m==='not'){ const aux=third?"doesn't":"don't"; en=`${w.en} ${aux} ${v.en} ${o[0]}.`;
   html=`${S_} <span class="r r-v">${aux} ${esc(v.en)}</span> ${O_}.`;
   bn=`<span class="r r-s">${w.bn.split(' (')[0]}</span> <span class="r r-o">${o[1]}</span> <span class="r r-v">${v.bn[w.p]} না</span>।`;
   note=third?`He / she / one person → <b>doesn't</b>, and the action word stays plain (no -s).`:`I / you / we / they → <b>don't</b>.`; }
 else { const aux=third?'Does':'Do'; const who=w.en==='I'?'I':w.en.charAt(0).toLowerCase()+w.en.slice(1); en=`${aux} ${who} ${v.en} ${o[0]}?`;
   html=`<span class="r r-v">${aux}</span> <span class="r r-s">${esc(who)}</span> <span class="r r-v">${esc(v.en)}</span> ${O_}?`;
   bn=`<span class="r r-s">${w.bn.split(' (')[0]}</span> কি <span class="r r-o">${o[1]}</span> <span class="r r-v">${v.bn[w.p]}</span>?`;
   note=`Questions start with <b>${aux}</b>${third?' (for he / she / one person)':''}.`; }
 return {en,html,bn,note,mn:v.mn};
}
function viewBuilder(){
 const v=B_VERB[BS.v]; const r=builderSentence();
 const bar=(cls,arr,cur,act,lab)=>`<div class="choicebar ${cls}">${arr.map((x,i)=>`<button class="${i===cur?'on':''}" data-act="${act}" data-arg="${i}">${esc(lab(x))}</button>`).join('')}</div>`;
 return `<div class="topbar"><button class="pill" data-act="go" data-arg="home">← Home</button></div>
 <h1>🧩 Build sentences</h1><div class="bn bnh muted">নিজে বাক্য বানান — যত খুশি!</div>
 <div class="card mt">
  <div class="choicebar">${[['say','Saying'],['not','Not'],['ask','Asking']].map(([k,l])=>`<button class="${BS.m===k?'on':''}" data-act="bmode" data-arg="${k}">${l}</button>`).join('')}</div>

  <div class="small muted mt">English: <span class="r-s">Who</span> → <span class="r-v">Action</span> → <span class="r-o">What</span>. <span class="bn bnh">বাংলা: কে → কী → কাজ।</span></div>
 </div>
 <label class="r-s">1 · Who? · কে?</label>${bar('cb-s',B_WHO,BS.w,'bw',x=>x.en)}
 <label class="r-v">2 · Action · কাজ</label>${bar('cb-v',B_VERB,BS.v,'bv',x=>x.en)}
 <label class="r-o">3 · What / where? · কী / কোথায়?</label>${bar('cb-o',v.o,Math.min(BS.o,v.o.length-1),'bo',x=>x[0])}
 <button class="btn btn-sec mt2" data-act="bsurprise">🔀 Surprise me</button>
 ${micBlock(r.en)}`;
}

   <label for="f-ctok">Coach token</label><input id="f-ctok" data-set="coachToken" value="${esc(st.coachToken)}" placeholder="(uses config.js)" autocomplete="off">
  </details>
 </div>
 <div class="card mt"><b>💾 Saving progress</b>
  <p class="small" style="margin-bottom:0">Progress saves by itself after every answer, in two places on this phone. Nothing to copy or remember. Just keep using the app from its home-screen icon.</p>
  <details class="mt"><summary class="small muted">Moving to a new phone? (family only)</summary>
   <p class="small muted">Copy this code on the old phone, then paste it on the new one.</p>
   <textarea id="bk-out" readonly>${esc(backupCode())}</textarea>
   <button class="btn btn-sec mt" data-act="copy-backup">📋 Copy code</button>
   <label for="bk-in">Paste code from the old phone</label><textarea id="bk-in" placeholder="Paste code here"></textarea>
   <button class="btn btn-sec mt" data-act="restore">Restore</button><div id="bk-msg" class="small mt"></div>
  </details>
 </div>
 <div class="card mt"><button class="btn btn-sec" data-act="reset">Start again from the beginning</button></div>`;
}
function backupCode(){ try{ return btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }catch(e){ return ''; } }

/* ---------------- Actions ---------------- */
let courseBack='home'; let timerInt=null;
let timerRunning=false;
function startTimer(sec,btn){
 if(timerRunning){ finishTimer(); return; }
 clearInterval(timerInt); const bar=document.getElementById('tbar'), msg=document.getElementById('tmsg'), rep_=document.getElementById('treport'); if(!bar)return;
 if(rep_)rep_.innerHTML=''; const listening=startTalk();
 let t=0; timerRunning=true; bar.style.width='0%';
 btn.textContent=`✋ I've finished (${sec})`; msg.innerHTML=listening?'🎙️ Listening — keep talking, mistakes are fine!':'🗣️ Keep talking — mistakes are fine!';
 timerInt=setInterval(()=>{ t++; if(!document.body.contains(bar)){clearInterval(timerInt);timerRunning=false;abortTalk();return;}
  bar.style.width=Math.min(100,t/sec*100)+'%'; btn.textContent=`✋ I've finished (${Math.max(0,sec-t)})`; if(t>=sec) finishTimer(); },1000);
}
function finishTimer(){
 clearInterval(timerInt); timerRunning=false;
 const btn=document.getElementById('tbtn'), msg=document.getElementById('tmsg'), bar=document.getElementById('tbar'), rp=document.getElementById('treport');
 if(bar)bar.style.width='100%'; if(btn){btn.textContent='⏱️ Go again';}
 if(msg)msg.innerHTML=`<b style="color:var(--ok)">🌟 Well done for talking!</b> <span class="bn bnh">শাবাশ!</span>`;
 const itId=SES&&SES.q[SES.i]&&SES.q[SES.i].it.id;
 if(talk){ if(rp)rp.innerHTML='<div class="muted mt">⏳ Checking what you said…</div>'; stopTalk((text,err)=>{ if(err&&!text){ if(rp)rp.innerHTML='<div class="tip">The phone couldn\'t listen here. Type what you said below, and I\'ll check it.</div>'; const tb=document.getElementById('typebox'); if(tb)tb.style.display='block'; return; } showReport(text,rp,itId); }); }
 else { if(rp)rp.innerHTML='<div class="tip">To get corrections, type what you said below — or turn on "Phone listens" in Settings.</div>'; const tb=document.getElementById('typebox'); if(tb)tb.style.display='block'; }
}
const A={
 go:a=>{ if(a==='course'&&!route().startsWith('lesson-')&&route()!=='course')courseBack=route(); go(a); },
 'back-from-course':()=>go(courseBack||'home'),
 start:()=>{askPersist();SES=null;go('practice');},
 extra:()=>{ startSession('extra'); if(!SES.q.length){SES=null;go('home');return;} go('practice'); },
 mood:a=>{ startSession(a); if(!SES.q.length){ startSession('extra'); } if(!SES.q.length){SES=null;go('home');return;} render(); },
 preview:a=>{ startSession('preview',+a); go('practice'); },
 say:(a,b)=>speak(b.dataset.text,{slow:a==='slow'}),
 reveal:()=>{ CS.revealed=true; const it=SES.q[SES.i].it; if(it.t==='phrase')pendingSpeak=it.say||it.en; if(it.t==='word')pendingSpeak=it.w+'. '+it.en; render(); },
 hint:()=>{CS.hint=true;render();},
 words:()=>{CS.showWords=true;render();},
 showex:()=>{CS.showEx=true;pendingSpeak=SES.q[SES.i].it.ex;render();},
 choose:a=>{ if(CS.chosen!==null)return; CS.chosen=+a; const it=SES.q[SES.i].it; if(it.t!=='listen')pendingSpeak=it.t==='fill'?fullFill(it):it.opts[it.a]; render(); },
 dchoose:a=>{ if(CS.chosen!==null)return; CS.chosen=+a; if(CS.chosen!==0)CS.misses++; pendingSpeak=SES.q[SES.i].it.turns[CS.turn].opts[0]; render(); },
 dnext:()=>{ const T=SES.q[SES.i].it.turns; CS.turn++; CS.chosen=null; CS.order=null; if(CS.turn>=T.length)CS.dlgDone=true; render(); window.scrollTo(0,document.body.scrollHeight); },
 dplay:()=>{ const T=SES.q[SES.i].it.turns; const lines=[]; T.forEach(t=>{lines.push({text:t.they,pitch:0.9});lines.push({text:t.opts[0],pitch:1.15});}); speakSeq(lines); },
 tile:a=>{ const w=buildWords(SES.q[SES.i].it); const i=+a; const next=CS.placed.length; if(w[i]===w[next]){CS.placed.push(i);CS.shake=-1; if(CS.placed.length===w.length)pendingSpeak=SES.q[SES.i].it.en;} else {CS.wrong++;CS.shake=i;} render(); },
 tilehelp:()=>{ const w=buildWords(SES.q[SES.i].it); const next=CS.placed.length; const j=CS.order.find(i=>!CS.placed.includes(i)&&w[i]===w[next]); if(j!=null){CS.placed.push(j);CS.wrong++;CS.shake=-1; if(CS.placed.length===w.length)pendingSpeak=SES.q[SES.i].it.en;} render(); },
 next:a=>{ try{recog&&recog.abort();}catch(e){} afterAnswer(a==='ok'); },
 'calm-next':()=>advance(),
 timer:(a,b)=>startTimer(+a,b),
 install:async()=>{ if(!deferredInstall)return; try{ deferredInstall.prompt(); const c=await deferredInstall.userChoice; if(c&&c.outcome==='accepted'){S.installed=true;save();} }catch(e){} deferredInstall=null; render(); },
 hideinstall:()=>{ S.hideInstall=true; save(); render(); },
 hidevoicetip:()=>{ S.hideVoiceTip=true; save(); render(); },
 pronrec:async(a,b)=>{ const fb=document.getElementById('micfb'); if(!fb)return; const text=b.dataset.text;
   if(REC.active){ b.disabled=true; b.textContent='⏳ Your coach is listening…'; const wav=REC.stop();
     try{ if(lastRecUrl)URL.revokeObjectURL(lastRecUrl); lastRecUrl=URL.createObjectURL(wav);}catch(e){}
     fb.innerHTML='<div class="muted">⏳ Checking your pronunciation…</div>';
     try{ if(!S.micOK){S.micOK=true;save();} const r=await COACH.pron(wav,fill(text)); fb.innerHTML=pronResultHTML(r,text); }
     catch(e){ fb.innerHTML='<div class="tip">I couldn\'t check it just now — but well done for speaking out loud! 😊</div>'; }
     b.disabled=false; b.textContent='🎤 Try again'; return; }
   try{ try{synth&&synth.cancel();}catch(e){} await REC.start(15,()=>{ if(REC.active) b.click(); }); b.textContent='⏹ I\'ve finished'; fb.innerHTML='<div class="muted">🎙️ Speak now…</div>'; }
   catch(e){ fb.innerHTML='<div class="tip">The microphone isn\'t available here — just say it out loud. 😊</div>'; b.remove(); } },
 playme:()=>{ if(!lastRecUrl)return; try{ synth&&synth.cancel(); new Audio(lastRecUrl).play(); }catch(e){} },
 coachtest:async(a,b)=>{ b.disabled=true; b.textContent='⏳ Testing…'; await COACH.ping(); render(); },
 rphint:()=>{ CS.hintShown=true; pendingSpeak=SES.q[SES.i].it.turns[CS.turn].ex; render(); },
 rpsaid:()=>rpAnswered(),
 rpmic:(a,b)=>{ const out=document.getElementById('rprep'); if(!out)return;
   if(talk){ b.disabled=true; b.textContent='⏳ Checking…'; stopTalk((t,err)=>{ b.disabled=false; b.textContent='🎤 Answer again';
      if(err&&!t){ out.innerHTML='<div class="tip">The phone can\'t listen here — type your answer below, or just say it out loud.</div>'; b.remove(); return; }
      showReport(t,out,null); rpAnswered(); }); return; }
   if(!startTalk()){ out.innerHTML='<div class="tip">The phone can\'t listen here — type your answer below, or just say it out loud.</div>'; b.remove(); return; }
   b.textContent="✋ I've finished"; out.innerHTML='<div class="muted mt">🎙️ Listening — take your time…</div>'; },
 rpnext:()=>{ abortTalk(); const T=SES.q[SES.i].it.turns; CS.turn++; CS.hintShown=false; if(CS.turn>=T.length)CS.dlgDone=true; render(); window.scrollTo(0,document.body.scrollHeight); },
 rpplay:()=>{ const T=SES.q[SES.i].it.turns; const lines=[]; T.forEach(t=>{ if(t.they)lines.push({text:t.they,pitch:0.9}); lines.push({text:t.ex,pitch:1.15}); }); speakSeq(lines); },
 typeopen:(a,b)=>{ const t=document.getElementById('typebox'); if(t){t.style.display='block'; b.remove(); const ta=document.getElementById('typed'); if(ta)ta.focus();} },
 checktyped:a=>{ const ta=document.getElementById('typed'); const out=document.getElementById('typedrep'); if(!ta||!out)return; showReport(ta.value,out,a||null); if(SES&&SES.q[SES.i]&&SES.q[SES.i].it&&SES.q[SES.i].it.t==='roleplay'&&ta.value.trim())rpAnswered(); },
 rest:()=>endSession('rest'),
 'home-reset':()=>{SES=null;go('home');},
 mic:(a,b)=>startMic(b.dataset.text,b),
 show:(a,b)=>{ const d=document.createElement('div'); d.className='overlay'; d.innerHTML=`<div class="huge">${esc(fill(b.dataset.text))}</div><div class="row mt2" style="width:100%;max-width:420px"><button class="btn btn-soft" data-act="say" data-text="${esc(b.dataset.text)}">🔊 Listen</button><button class="btn btn-pri" data-act="close-ov">Close</button></div>`; document.body.appendChild(d); },
 rule:a=>{ const it=byId[a]; if(!it)return; const d=document.createElement('div'); d.className='overlay left'; d.innerHTML=`<div style="max-width:520px;margin:0 auto;width:100%"><div class="card">${conceptBody(it)}</div><button class="btn btn-pri mt" data-act="close-ov">Close</button></div>`; document.body.appendChild(d); },
 'close-ov':(a,b)=>{ const o=b.closest('.overlay'); if(o)o.remove(); },
 'test-voice':()=>speak("Hello! Lovely to meet you. Would you like a cup of tea?"),
 bw:a=>{BS.w=+a;render();}, bv:a=>{BS.v=+a;BS.o=0;render();}, bo:a=>{BS.o=+a;render();}, bmode:a=>{BS.m=a;render();},
 bsurprise:()=>{BS.w=Math.floor(Math.random()*B_WHO.length);BS.v=Math.floor(Math.random()*B_VERB.length);BS.o=Math.floor(Math.random()*B_VERB[BS.v].o.length);BS.m=pick(['say','say','not','ask']);render(); speak(builderSentence().en);},
 'setup-done':()=>{ askPersist(); const st=S.settings; const v=id=>document.getElementById(id).value.trim(); st.name=v('su-name'); st.home=v('su-home')||'Kolkata'; st.who=v('su-who'); st.city=v('su-city')||'London'; st.stay=v('su-stay'); st.trip=v('su-trip'); st.setupDone=true; save(); go('home'); render(); },
 'copy-backup':(a,b)=>{ const t=document.getElementById('bk-out'); try{ navigator.clipboard.writeText(t.value).then(()=>{b.textContent='✓ Copied';},()=>{t.select();b.textContent='Selected — now copy';}); }catch(e){ t.select(); b.textContent='Selected — now copy'; } },
 restore:()=>{ const v=document.getElementById('bk-in').value.trim(); const m=document.getElementById('bk-msg'); try{ const d=JSON.parse(decodeURIComponent(escape(atob(v)))); if(!d||!d.cards)throw 0; S=merge(d); save(); m.textContent='✓ Restored!'; setTimeout(render,700);}catch(e){ m.textContent='That code did not work. Please check it was copied fully.'; } },
 reset:(a,b)=>{ if(b.dataset.armed){ const keep={...S.settings}; S=blank(); S.settings=keep; save(); SES=null; go('home'); } else { b.dataset.armed='1'; b.textContent='Tap again to confirm — all progress will be cleared'; b.style.borderColor='#C0392B'; } }
};
document.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b||b.disabled)return; const f=A[b.dataset.act]; if(f)f(b.dataset.arg,b); });
document.addEventListener('change',e=>{ const el=e.target; const k=el.dataset&&el.dataset.set; if(!k)return; let v=el.value;
 if(['minutes','newPerDay','rate'].includes(k))v=+v; if(['bengali','mic','autoplay'].includes(k))v=v==='1';
 S.settings[k]=v; save(); applyLook(); if(k==='mic'&&v)micBroken=false; });
document.addEventListener('input',e=>{ const el=e.target; const k=el.dataset&&el.dataset.set; if(['name','city','home','coachUrl','coachToken'].includes(k)){ S.settings[k]=el.value; save(); } });

render();
COACH.ping().then(()=>{ if(route()==='family'||(route()==='home'))render(); });
window.addEventListener('online',()=>COACH.ping());
if('serviceWorker' in navigator&&location.protocol==='https:'&&window.top===window.self){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} }
</script>
